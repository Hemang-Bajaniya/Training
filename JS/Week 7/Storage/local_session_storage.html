<body>
    <button id="log_btn">Log time</button>
</body>

<script>

    //     alert(element);
    // }

    // // stringify whole obj
    // console.log(JSON.stringify(localStorage));

    log_btn.addEventListener("click", (e) => {
        localStorage.setItem('now', Date.now());
    });

    window.onstorage = e => {
        if (e.key != "now")
            return;

        alert(`Now old:${e.oldValue} new:${e.newValue} updated by:${e.url}`);
    }

</script>
