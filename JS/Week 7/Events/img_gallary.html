<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Image Gallery</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            padding: 40px;
        }

        .gallery {
            max-width: 700px;
            margin: auto;
            background: #fff;
            padding: 15px;
            border-radius: 6px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.15);
        }

        .main-image img {
            width: 100%;
            height: auto;
            border-radius: 4px;
        }

        .thumbnails {
            display: flex;
            gap: 10px;
            margin-top: 12px;
            justify-content: center;
        }

        .thumbnails img {
            width: 90px;
            height: 60px;
            object-fit: cover;
            cursor: pointer;
            border-radius: 4px;
            opacity: 0.6;
            border: 2px solid transparent;
            transition: 0.3s;
        }

        .thumbnails img:hover {
            opacity: 1;
        }

        .thumbnails img.active {
            opacity: 1;
            border-color: #ff5a00;
        }
    </style>
</head>

<body>

    <div class="gallery">
        <div class="main-image">
            <img id="currentImage"
                src="https://images.unsplash.com/photo-1761839271800-f44070ff0eb9?w=500&auto=format&fit=crop&q=60&ixlib=rb-4.1.0&ixid=M3wxMjA3fDF8MHxmZWF0dXJlZC1waG90b3MtZmVlZHwzNnx8fGVufDB8fHx8fA%3D%3D"
                alt="Main Image">
        </div>

        <div class="thumbnails" id="thumbnails" onclick="handleImageChange(event)">
            <img src="https://images.unsplash.com/photo-1765202662614-fa22254ee59c?w=500&auto=format&fit=crop&q=60&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxmZWF0dXJlZC1waG90b3MtZmVlZHw0fHx8ZW58MHx8fHx8"
                class="active">
            <img
                src="https://images.unsplash.com/photo-1765211003203-c87da12a6747?w=500&auto=format&fit=crop&q=60&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxmZWF0dXJlZC1waG90b3MtZmVlZHwyNHx8fGVufDB8fHx8fA%3D%3D">
            <img
                src="https://images.unsplash.com/photo-1761839257658-23502c67f6d5?w=500&auto=format&fit=crop&q=60&ixlib=rb-4.1.0&ixid=M3wxMjA3fDF8MHxmZWF0dXJlZC1waG90b3MtZmVlZHwyOXx8fGVufDB8fHx8fA%3D%3D">
            <img
                src="https://images.unsplash.com/photo-1761839271800-f44070ff0eb9?w=500&auto=format&fit=crop&q=60&ixlib=rb-4.1.0&ixid=M3wxMjA3fDF8MHxmZWF0dXJlZC1waG90b3MtZmVlZHwzNnx8fGVufDB8fHx8fA%3D%3D">
        </div>
    </div>

    <script>
        let currentThumb;
        function handleImageChange(e) {
            if (e.target.tagName == "IMG") {
                currentThumb?.classList.remove("active");
                currentImage.src = e.target.src;
                currentThumb = e.target;
                currentThumb.classList.add("active");
            }
        }
    </script>

</body>

</html>
