<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Display XML Example</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light p-4">

    <div class="container">
        <h1 class="mb-4 text-center">Displaying External XML File</h1>

        <!-- Using the <object> tag -->
        <div class="card mb-4">
            <div class="card-header bg-primary text-white">
                Display with &lt;object&gt; tag
            </div>
            <div class="card-body">
                <object data="d.xml" type="text/xml" width="100%" height="200">
                    <p>Your browser does not support the object element.</p>
                </object>
            </div>
        </div>

        <!-- Using the <iframe> tag -->
        <div class="card">
            <div class="card-header bg-success text-white">
                Display with &lt;iframe&gt; tag
            </div>
            <div class="card-body">
                <iframe src="d.xml" width="100%" height="200" title="XML Display"></iframe>
            </div>
        </div>
    </div>

</body>

</html>
