<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bootstrap Padding and Margin Example</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

    <div class="container mt-10">
        <div class="box bg-primary text-white p-4 m-3">
            This div has both padding and margin.
        </div>

        <div class="box bg-info text-white p-5 mt-4">
            This div has more padding on all sides and margin only at the top.
        </div>

        <div class="box bg-success text-white p-3 m-0">
            This div has padding and no margin.
        </div>
    </div>

</body>

</html>
