<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Custom Bootstrap Styles</title>
    <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet">

    <!-- Custom Styles -->
    <style>
        .btn-primary {
            background-color: #ff5733;
            border-color: #ff5733;
        }

        .container {
            padding-left: 50px;
            padding-right: 50px;
        }

        h1 {
            font-size: 3rem;
            color: #003366;
        }
    </style>
</head>

<body>

    <div class="container">
        <h1>Custom Bootstrap Styling</h1>
        <button class="btn btn-primary">Custom Button</button>
    </div>

</body>

</html>
