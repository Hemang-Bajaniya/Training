<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body
        {
            font-family: cursive;
        }
    </style>
    <title>Padding-Margin</title>
</head>
<body>
    <p style="padding: 10px 30px 20px 40px; border:5px solid black" >
        padding:- 10px-top, 30px-right, 20px-bottom, 40px-left
    </p>
    <p style="padding-top: 2%; border:5px solid black" >padding:- 2% top</p>
    <p style="padding-left: 10%; border:5px solid black" >padding:- 10% left</p>
    <p style="padding-right: 10%; border:5px solid black" >padding:- 10% right</p>
    <p style="padding-bottom: 2%; border:5px solid black" >padding:- 2% bottom</p>

    <hr>

    <p style="margin:  30px 10px 50px 20px; border:5px solid black" >
        margin:- 30px-top, 10px-right, 50px-bottom, 20px-left
    </p>
    <p style="margin-top: 2%; border:5px solid black" >margin:- 2% top</p>
    <p style="margin-left: 2%; border:5px solid black" >margin:- 2% left</p>
    <p style="margin-right: 2%; border:5px solid black" >margin:- 2% right</p>
    <p style="margin-bottom: 5%; border:5px solid black" >margin:- 5% bottom</p>
</body>
</html>
