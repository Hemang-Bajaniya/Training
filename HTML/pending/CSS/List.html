<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>List</title>
    <style>
        body
        {
            font-family: cursive;
        }
    </style>
</head>
<body>
<ul style="list-style-type: squre">
    <li>banana</li>
    <li>mangoes</li>
    <li>apples</li>
</ul>

<ul style="list-style-type: circle">
    <li>fortuner</li>
    <li>scorpio</li>
    <li>safari</li>
</ul>

<ol style="list-style-type: upper-alpha">
    <li>HTML</li>
    <li>CSS</li>
    <li>Javascript</li>
</ol>

<ol style="list-style-type: lower-roman">
    <li>HP</li>
    <li>Lenovo</li>
    <li>Acer</li>
</ol>

<ol style="list-style-image: url(../images/arrow.png)">
    <li>first</li>
    <li>second</li>
    <li>third</li>
</ol>

<ol style="list-style-position: outside">
    <li>first<br>item</li>
    <li>second<br>item</li>
    <li>third<br>item</li>
</ol>

<ol style="list-style-position: inside">
    <li>first<br>item</li>
    <li>second<br>item</li>
    <li>third<br>item</li>
</ol>
</body>
</html>
