<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body{
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        form{
            box-shadow: 0px 2px 3px rgba(0, 0, 0, 0.1);
        }
        form input{
            height: 1rem;
            width: 13rem;
            padding: 5px;
            border-radius: 4px;
            border: 1px solid;
            position: relative;
            outline: none;
        }
        form input:focus{
            border: 2px solid #1a73e8;
        }
        form input:focus+label{
            transform: translate(-2px,-13px);
            padding: 0px 4px;
            font-size: .8rem;
            color: #1a73e8;
            z-index: 100;
            background-color: #fff;
        }
        .txt{
            position: relative;
        }
        label{
            position: absolute;
            top: 2px;
            left: 12px;
            transition: .2s ease;
        }
    </style>
</head>
<body>
    <form action="">
        <div class="txt">
        <input type="text" name="ip">
        <label for="ip">user name</label>
    </div>
    </form>
</body>
</html>
