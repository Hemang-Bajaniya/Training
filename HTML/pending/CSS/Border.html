<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Border</title>
</head>
<body>
    <p style="border-style:dashed; border-width:5px solid black">this is dashed border</p>
    <p style="border-style: dotted; border-width:5px solid black">this is dotted border</p>
    <p style="border-style:groove; border-width:5px solid black">this is groove border</p>
    <p style="border-style:solid; border-width:5px solid black">this is solid border</p>
    <p style="border-style:inset; border-width:5px solid black">this is inset border</p>
    <p style="border-style:outset; border-width:5px solid black">this is outset border</p>

    <p style="
    border-top-style: dotted; border-left-style: solid;
    border-right-style: inset; border-bottom-style: dashed;">
    top-style: dotted
    left-style: solid
    right-style: inset
    bottom-style: dashed
    </p>

    <p style="border-color: green; border-style: solid;">border color is green</p>
    <p style="border-top-color: red; border-bottom-color: blue;
            border-left-color: green; border-right-color: yellow;
     border-style: solid;">border color is green
     </p>
     
     <p style="border: 5px dotted coral">all in one border</p>
</body>
</html>
