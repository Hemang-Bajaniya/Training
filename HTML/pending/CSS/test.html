<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Animation</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            overflow-x: hidden;
            overflow: visible;
        }

        body {
            min-height: 100vh;
            display: grid;
            background-color: #333;
            place-items: center;
        }

        .wrapper {
            padding: 10px 20px;
            display: flex;
            justify-content: space-evenly;
            position: relative;
        }

        .box {
            width: clamp(320px, 20vw, 800px);
            aspect-ratio: 1;
            background-color: rgba(110, 110, 110, 0.1);
            box-shadow: 1px 3px 4px rgba(48, 48, 48, 0.7);
            backdrop-filter: blur(10px);
            backface-visibility: visible;
            border-radius: 10px;
            border-top: 1px solid #4e4e4e;
            border-left: 1px solid #4e4e4e;
            position: relative;
            z-index: 0;
            margin: 0 50px;
            transform: rotate(365deg);
            animation: boxAnimation 6s ease infinite forwards;
        }

        .obj1,
        .obj2 {
            height: 100px;
            position: absolute;
            aspect-ratio: 1;
            transition: all 7s ease;
        }

        .obj1 {
            top: -30%;
            left: -40%;
            border-radius: 18px;
            background: linear-gradient(140deg, rgb(255, 255, 104), rgb(85, 255, 150));
            animation: objAnimation1 5s ease-in-out infinite;
        }

        .obj2 {
            border-radius: 100%;
            background: radial-gradient(rgb(255, 109, 104), rgb(192, 83, 255));
            top: 100%;
            right: -40%;
            animation: objAnimation2 5s ease-in-out infinite;
        }

        @keyframes boxAnimation {
            0% {
                transform: rotate(0deg);
            }

            25% {
                transform: rotate(-12deg);
            }

            75% {
                transform: rotate(12deg);
            }

            100% {
                transform: rotate(0deg);
            }
        }

        @keyframes objAnimation1 {
            0% {
                top: -30%;
                left: -40%;
                z-index: 1;
            }

            50% {
                transform: rotate(360deg);
                top: 100%;
                left: 140%;
            }

            100% {
                top: -30%;
                left: -40%;
            }
        }

        @keyframes objAnimation2 {
            0% {
                top: 100%;
                right: -40%;
                z-index: -1;
            }

            50% {
                transform: rotate(360deg);
                top: -30%;
                right: 140%;
            }

            100% {
                top: 100%;
                right: -40%;
            }
        }
    </style>
</head>

<body>
    <div class="wrapper">
        <div class="obj1"></div>
        <div class="box"></div>
        <div class="obj2"></div>
    </div>

</body>

</html>
