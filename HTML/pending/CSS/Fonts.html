<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fonts</title>
</head>
<body>
    <p style="font-family: gerogia, grandmond, cursive">font familiy is cursive</p>
    <p style="font-style: italic">font will be rendered as italic</p>
    <p style="font-variant: small-caps">font will be rendered as small-caps</p>

    <p style="font-weight: bold">this is a bold text</p>
    <p style="font-weight: lighter">this is a lighter text</p>
    <p style="font-weight: 900">this is a bold text 900</p>

    <p style="font-size: 20px">font size is 20px</p>
    <p style="font-size: 200%">font size is 20%</p>
    <p style="font-size: small">font size is small</p>

    <p style="line-height: 50px">select this text line height is 50px</p>

    <p style="font: italic bold 20px/10px cursive "> <!--font:style wight size/line-height family-->
        all in one example
    </p>
</body>
</html>
