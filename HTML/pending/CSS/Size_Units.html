<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Size Units</title>
    <style>
        *{
            font-family: Verdana, Geneva, Tahoma, sans-serif;
        }
        .container{
            font-size: 30px;
            padding-left: 20px;
            border: 3px solid lightcoral;
            height: 100vh;
            width: 50vw;
        }
        p{
            font-size: 1.5em;
            padding-left: 2em;
        }
        .parent{
            background-color: blue;
            width: 100px;
        }
        .child{
            background-color: green;
            width: 50%;
        }

    </style>
</head>
<body>
    <div class="container">
        this is a container
        <p>first para</p>
        <p>second para</p>
        <p>third para</p>
        </div>
    </div>

    <div class="parent">
        PARENT
        <div class="child">
        CHILD
        </div>
    </div>
</body>
</html>
