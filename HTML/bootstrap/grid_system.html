<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bootstrap Grid Example</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        .col {
            border: 1px solid;
            text-align: center;
            /* margin: 10px; */
        }
    </style>

</head>

<body>

    <div class="container">
        <div class="row">
            <div class="col">Header</div>
        </div>
        <div class="row">
            <div class="col-8 bg-light">
                <div class="row">
                    <div class="col-6 bg-info">Nested 1</div>
                    <div class="col-6 bg-warning">Nested 2</div>
                </div>
            </div>
            <div class="col-4 bg-danger text-white">Sidebar</div>
            <div class="col col-8">
                <div class="container text-center">
                    <div class="row">
                        <div class="col-sm-6 col-md-4 col-lg-3 bg-info">Column 1</div>
                        <div class="col-sm-6 col-md-4 col-lg-3 bg-warning">Column 2</div>
                        <div class="col-sm-6 col-md-4 col-lg-3 bg-danger">Column 3</div>
                        <div class="col-sm-6 col-md-4 col-lg-3 bg-success">Column 4</div>
                    </div>

                </div>

            </div>
            <div class="col col-4">
                <div class="row">
                    <div class="col bg-primary">Auto 1</div>
                    <div class="col bg-secondary">Auto 2</div>
                    <div class="col bg-success">Auto 3</div>
                </div>
            </div>
        </div>

        <div class="row justify-content-end align-items-start" style="height:200px; background: rgb(214, 211, 211);">
            <div class="col-3 bg-primary text-white">Box 1</div>
            <div class="col-3 bg-success text-white">Box 2</div>
        </div>

        <div class="row justify-content-center align-items-center"
            style="height:200px; background: rgb(214, 211, 211);">
            <div class="col-3 bg-primary text-white">Box 1</div>
            <div class="col-3 bg-success text-white">Box 2</div>
        </div>

        <div class="row justify-content-end align-items-end" style="height:200px; background: rgb(214, 211, 211);">
            <div class="col-3 bg-primary text-white">Box 1</div>
            <div class="col-3 bg-success text-white">Box 2</div>
        </div>

        <div class="row">
            <div class="col">Footer</div>
        </div>
    </div>




    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
